<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#18181C"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad2)"/>
  <rect x="24" y="24" width="1152" height="632" rx="12" fill="#141416" stroke="#2B2B30" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- Window Titlebar -->
  <rect x="24" y="24" width="1152" height="48" rx="12" fill="#1A1A1E" stroke="#2B2B30" stroke-width="1"/>
  <circle cx="52" cy="48" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="72" cy="48" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="92" cy="48" r="6" fill="#10B981" opacity="0.9"/>

  <text x="576" y="53" fill="#E2E2E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    IL2CppManager — Hierarchical Metadata &amp; Class Inspector
  </text>

  <!-- Left Sidebar (Assemblies & Namespaces) -->
  <g transform="translate(48, 88)">
    <rect width="320" height="544" rx="8" fill="#18181C" stroke="#2B2B30" stroke-width="1"/>
    
    <!-- Sidebar Search -->
    <g transform="translate(12, 12)">
      <rect width="296" height="34" rx="6" fill="#121214" stroke="#27272A" stroke-width="1"/>
      <text x="12" y="22" fill="#71717A" font-family="sans-serif" font-size="12">Filter assemblies / classes...</text>
    </g>

    <!-- Assemblies List -->
    <g transform="translate(12, 58)">
      <rect width="296" height="32" rx="6" fill="#222226" stroke="#35353D" stroke-width="1"/>
      <text x="12" y="21" fill="#818CF8" font-family="monospace" font-size="11" font-weight="bold">📁 Assembly-CSharp.dll</text>
      <text x="284" y="21" fill="#71717A" font-family="monospace" font-size="10" text-anchor="end">412</text>
    </g>

    <!-- Namespace Items -->
    <g transform="translate(24, 98)">
      <text x="10" y="16" fill="#A1A1AA" font-family="monospace" font-size="11">▾ UnityEngine</text>
      <text x="24" y="38" fill="#D4D4D8" font-family="monospace" font-size="11">GameObject</text>
      <text x="24" y="58" fill="#D4D4D8" font-family="monospace" font-size="11">Transform</text>
      <text x="24" y="78" fill="#D4D4D8" font-family="monospace" font-size="11">Component</text>
    </g>

    <g transform="translate(24, 190)">
      <text x="10" y="16" fill="#818CF8" font-family="monospace" font-size="11" font-weight="bold">▾ Game.Core.Player</text>
      <rect x="0" y="24" width="284" height="28" rx="4" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1"/>
      <text x="16" y="42" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">PlayerController</text>
      <text x="16" y="68" fill="#D4D4D8" font-family="monospace" font-size="11">PlayerInventory</text>
      <text x="16" y="92" fill="#D4D4D8" font-family="monospace" font-size="11">PlayerMotor</text>
      <text x="16" y="116" fill="#D4D4D8" font-family="monospace" font-size="11">HealthComponent</text>
    </g>
  </g>

  <!-- Right Main Area: Class Details (Fields & Methods) -->
  <g transform="translate(384, 88)">
    <rect width="768" height="544" rx="8" fill="#18181C" stroke="#2B2B30" stroke-width="1"/>

    <!-- Header for selected Class -->
    <g transform="translate(20, 20)">
      <rect width="728" height="60" rx="8" fill="#1F1F24" stroke="#32323A" stroke-width="1"/>
      <text x="16" y="28" fill="#F4F4F5" font-family="monospace" font-size="15" font-weight="bold">class PlayerController : MonoBehaviour</text>
      <text x="16" y="48" fill="#9CA3AF" font-family="monospace" font-size="11">TypeDefIndex: 1042 | Size: 0x88 | VTable Slots: 24</text>
      <rect x="612" y="16" width="100" height="28" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1"/>
      <text x="662" y="34" fill="#A5B4FC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Add to Watchlist</text>
    </g>

    <!-- Fields Section -->
    <g transform="translate(20, 96)">
      <text x="0" y="14" fill="#E2E2E8" font-family="sans-serif" font-size="13" font-weight="bold">Fields &amp; Memory Offsets (6)</text>

      <!-- Field Table -->
      <rect x="0" y="24" width="728" height="180" rx="6" fill="#131316" stroke="#26262B" stroke-width="1"/>

      <!-- Row 1 -->
      <g transform="translate(16, 36)">
        <text x="0" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">0x18</text>
        <text x="70" y="14" fill="#60A5FA" font-family="monospace" font-size="11">public Boolean</text>
        <text x="210" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">isGrounded</text>
        <text x="560" y="14" fill="#71717A" font-family="monospace" font-size="11">Offset: 0x18</text>
      </g>
      <line x1="16" y1="62" x2="712" y2="62" stroke="#222226" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(16, 74)">
        <text x="0" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">0x20</text>
        <text x="70" y="14" fill="#60A5FA" font-family="monospace" font-size="11">public Single</text>
        <text x="210" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">movementSpeed</text>
        <text x="560" y="14" fill="#71717A" font-family="monospace" font-size="11">Offset: 0x20</text>
      </g>
      <line x1="16" y1="100" x2="712" y2="100" stroke="#222226" stroke-width="1"/>

      <!-- Row 3 -->
      <g transform="translate(16, 112)">
        <text x="0" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">0x28</text>
        <text x="70" y="14" fill="#A78BFA" font-family="monospace" font-size="11">public Vector3</text>
        <text x="210" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">currentVelocity</text>
        <text x="560" y="14" fill="#71717A" font-family="monospace" font-size="11">Offset: 0x28</text>
      </g>
      <line x1="16" y1="138" x2="712" y2="138" stroke="#222226" stroke-width="1"/>

      <!-- Row 4 -->
      <g transform="translate(16, 150)">
        <text x="0" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">0x34</text>
        <text x="70" y="14" fill="#34D399" font-family="monospace" font-size="11">public static PlayerController</text>
        <text x="290" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">localPlayer</text>
        <text x="560" y="14" fill="#71717A" font-family="monospace" font-size="11">Offset: 0x34</text>
      </g>
    </g>

    <!-- Methods Section -->
    <g transform="translate(20, 316)">
      <text x="0" y="14" fill="#E2E2E8" font-family="sans-serif" font-size="13" font-weight="bold">Methods &amp; Runtime Virtual Addresses (RVA)</text>

      <rect x="0" y="24" width="728" height="175" rx="6" fill="#131316" stroke="#26262B" stroke-width="1"/>

      <!-- Method Row 1 -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="84" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <text x="42" y="14" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x18F420</text>
        <text x="96" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">public Void Update()</text>
        <text x="580" y="14" fill="#6366F1" font-family="sans-serif" font-size="11" font-weight="600">Graph View →</text>
      </g>
      <line x1="16" y1="62" x2="712" y2="62" stroke="#222226" stroke-width="1"/>

      <!-- Method Row 2 -->
      <g transform="translate(16, 74)">
        <rect x="0" y="0" width="84" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <text x="42" y="14" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x18FA80</text>
        <text x="96" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">public Void SetPosition(Vector3 newPos)</text>
        <text x="580" y="14" fill="#6366F1" font-family="sans-serif" font-size="11" font-weight="600">Graph View →</text>
      </g>
      <line x1="16" y1="100" x2="712" y2="100" stroke="#222226" stroke-width="1"/>

      <!-- Method Row 3 -->
      <g transform="translate(16, 112)">
        <rect x="0" y="0" width="84" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <text x="42" y="14" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x1901C0</text>
        <text x="96" y="14" fill="#F4F4F5" font-family="monospace" font-size="11" font-weight="600">public Single GetHealthRatio()</text>
        <text x="580" y="14" fill="#6366F1" font-family="sans-serif" font-size="11" font-weight="600">Graph View →</text>
      </g>
    </g>
  </g>
</svg>
