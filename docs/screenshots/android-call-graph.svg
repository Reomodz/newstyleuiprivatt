    <text x="60" y="103" fill="#818CF8" font-family="monospace" font-size="12" text-anchor="middle">0x182E400</text>
    <rect x="115" y="85" width="110" height="26" rx="6" fill="#1E1B4B"/>
    <text x="170" y="103" fill="#818CF8" font-family="monospace" font-size="12" text-anchor="middle">0x7B4282E400</text>
    <rect x="15" y="125" width="280" height="40" rx="10" fill="#312E81"/>
    <text x="155" y="150" fill="#E0E7FF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">Calls (2) ▲</text>
