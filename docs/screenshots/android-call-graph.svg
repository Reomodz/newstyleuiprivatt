    <text x="30" y="32" fill="#94A3B8" font-size="20">🔍</text>
    <text x="75" y="32" fill="#94A3B8" font-size="20">➕</text>
    <text x="120" y="32" fill="#94A3B8" font-size="20">🎯</text>
