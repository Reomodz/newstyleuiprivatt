  <g transform="translate(40, 1420)">
    <rect x="0" y="0" width="820" height="90" rx="18" fill="#14151B" stroke="#252733" stroke-width="1.5"/>
    <text x="25" y="42" fill="#F8FAFC" font-family="monospace" font-size="20" font-weight="700">public void Start()</text>
    <text x="25" y="70" fill="#64748B" font-family="monospace" font-size="15">GamePlay.Player.PlayerController · RVA: 0x182E400</text>
    <rect x="670" y="22" width="130" height="46" rx="12" fill="url(#purpleBtn)"/>
    <text x="735" y="51" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">Inspect Tab</text>
