  <text x="812" y="132" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Canvas (1)</text>

  <!-- Sub Navigation Bar -->
  <g transform="translate(40, 190)">
    <rect x="0" y="0" width="140" height="44" rx="12" fill="#5B4DF0"/>
    <text x="70" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Call Graph</text>
    <rect x="150" y="0" width="140" height="44" rx="12" fill="#1C1E26" stroke="#2C2E3A" stroke-width="1"/>
