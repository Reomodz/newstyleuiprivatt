<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#18181C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#18181A"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>

  <!-- Window Frame -->
  <rect x="24" y="24" width="1152" height="632" rx="12" fill="#141416" stroke="#2B2B30" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Window Titlebar -->
  <rect x="24" y="24" width="1152" height="48" rx="12" fill="#1A1A1E" stroke="#2B2B30" stroke-width="1"/>
  <!-- Window Controls -->
  <circle cx="52" cy="48" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="72" cy="48" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="92" cy="48" r="6" fill="#10B981" opacity="0.9"/>

  <!-- App Header Title in Bar -->
  <text x="576" y="53" fill="#E2E2E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    IL2CppManager — Watchlist Profiles &amp; Target Scanner
  </text>

  <!-- Top Navigation Ribbon -->
  <g transform="translate(48, 88)">
    <!-- Process Badge -->
    <rect x="0" y="0" width="220" height="40" rx="8" fill="#1E1E22" stroke="#323238" stroke-width="1"/>
    <circle cx="20" cy="20" r="4" fill="#10B981"/>
    <text x="34" y="25" fill="#A1A1AA" font-family="monospace" font-size="12">PID 8492 — Unity.exe</text>

    <!-- Search Input Bar -->
    <rect x="236" y="0" width="460" height="40" rx="8" fill="#18181B" stroke="#2B2B30" stroke-width="1"/>
    <text x="254" y="25" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Search targets, classes, members...</text>

    <!-- Scan Trigger Button -->
    <rect x="712" y="0" width="180" height="40" rx="8" fill="url(#accentGrad)" stroke="#6366F1" stroke-width="1"/>
    <text x="802" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Run Memory Scan</text>

    <!-- Options Button -->
    <rect x="908" y="0" width="196" height="40" rx="8" fill="#222226" stroke="#323238" stroke-width="1"/>
    <text x="1006" y="25" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚙ Card Settings</text>
  </g>

  <!-- Profile Watchlist Cards Grid -->
  <g transform="translate(48, 150)">
    <!-- Profile Card 1 (Active) -->
    <g transform="translate(0, 0)">
      <rect width="536" height="215" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1.5"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1"/>
      <text x="34" y="39" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">P</text>

      <text x="64" y="33" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold">Player Movement &amp; Stats</text>
      <text x="64" y="50" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Core player instance pointer, position coordinates, and velocity</text>

      <!-- Active Badge -->
      <rect x="410" y="16" width="110" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="465" y="32" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Active for Scan</text>

      <!-- Target Items Preview Inside Card -->
      <g transform="translate(16, 70)">
        <rect width="504" height="34" rx="6" fill="#121214" stroke="#26262A" stroke-width="1"/>
        <text x="14" y="22" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="600">m_LocalPlayer</text>
        <text x="160" y="22" fill="#71717A" font-family="monospace" font-size="10">PlayerController.localPlayer</text>
        <rect x="424" y="6" width="68" height="22" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <text x="458" y="21" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x18F420</text>
      </g>

      <g transform="translate(16, 112)">
        <rect width="504" height="34" rx="6" fill="#121214" stroke="#26262A" stroke-width="1"/>
        <text x="14" y="22" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="600">m_HealthPoints</text>
        <text x="160" y="22" fill="#71717A" font-family="monospace" font-size="10">HealthComponent.currentHealth</text>
        <rect x="424" y="6" width="68" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
        <text x="458" y="21" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x28</text>
      </g>

      <!-- Card Footer -->
      <line x1="16" y1="162" x2="520" y2="162" stroke="#27272A" stroke-width="1"/>
      <text x="16" y="190" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">6 Targets Configured</text>
      <text x="520" y="190" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="end">Open Profile Targets →</text>
    </g>

    <!-- Profile Card 2 -->
    <g transform="translate(568, 0)">
      <rect width="536" height="215" rx="12" fill="url(#cardGrad)" stroke="#2C2C30" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="1"/>
      <text x="34" y="39" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">W</text>

      <text x="64" y="33" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold">Weapon &amp; Ballistics System</text>
      <text x="64" y="50" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Recoil spread modifiers, ammo clip counters, and fire rate</text>

      <!-- Target Items Preview Inside Card -->
      <g transform="translate(16, 70)">
        <rect width="504" height="34" rx="6" fill="#121214" stroke="#26262A" stroke-width="1"/>
        <text x="14" y="22" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="600">m_NoRecoilModifier</text>
        <text x="175" y="22" fill="#71717A" font-family="monospace" font-size="10">WeaponController.recoilSpread</text>
        <rect x="424" y="6" width="68" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
        <text x="458" y="21" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x30</text>
      </g>

      <g transform="translate(16, 112)">
        <rect width="504" height="34" rx="6" fill="#121214" stroke="#26262A" stroke-width="1"/>
        <text x="14" y="22" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="600">m_InfiniteAmmo</text>
        <text x="175" y="22" fill="#71717A" font-family="monospace" font-size="10">WeaponController.currentAmmo</text>
        <rect x="424" y="6" width="68" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
        <text x="458" y="21" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x44</text>
      </g>

      <!-- Card Footer -->
      <line x1="16" y1="162" x2="520" y2="162" stroke="#27272A" stroke-width="1"/>
      <text x="16" y="190" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">4 Targets Configured</text>
      <text x="520" y="190" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="end">Open Profile Targets →</text>
    </g>
  </g>

  <!-- Bottom Scan History / Metadata Summary Bar -->
  <g transform="translate(48, 390)">
    <rect width="1104" height="230" rx="12" fill="#161619" stroke="#26262B" stroke-width="1"/>

    <!-- Section Header -->
    <g transform="translate(20, 20)">
      <circle cx="8" cy="8" r="4" fill="#6366F1"/>
      <text x="22" y="12" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Recent Scan History &amp; Resolved Offsets</text>
      <text x="1064" y="12" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">Auto-Saved to Local Storage</text>
    </g>

    <!-- Scan Log Row 1 -->
    <g transform="translate(20, 52)">
      <rect width="1064" height="48" rx="8" fill="#1E1E22" stroke="#2B2B30" stroke-width="1"/>
      <rect x="14" y="14" width="70" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="49" y="28" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SUCCESS</text>
      <text x="96" y="29" fill="#E4E4E7" font-family="monospace" font-size="12" font-weight="600">Profile: Player Movement &amp; Stats</text>
      <text x="440" y="29" fill="#9CA3AF" font-family="monospace" font-size="11">6 / 6 Targets Resolved (100%)</text>
      <text x="820" y="29" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Just now</text>
      <rect x="940" y="10" width="110" height="28" rx="6" fill="#2B2B30" stroke="#3D3D45" stroke-width="1"/>
      <text x="995" y="28" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">View Offsets →</text>
    </g>

    <!-- Scan Log Row 2 -->
    <g transform="translate(20, 110)">
      <rect width="1064" height="48" rx="8" fill="#1E1E22" stroke="#2B2B30" stroke-width="1"/>
      <rect x="14" y="14" width="70" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="49" y="28" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SUCCESS</text>
      <text x="96" y="29" fill="#E4E4E7" font-family="monospace" font-size="12" font-weight="600">Profile: Weapon &amp; Ballistics System</text>
      <text x="440" y="29" fill="#9CA3AF" font-family="monospace" font-size="11">4 / 4 Targets Resolved (100%)</text>
      <text x="820" y="29" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">5 mins ago</text>
      <rect x="940" y="10" width="110" height="28" rx="6" fill="#2B2B30" stroke="#3D3D45" stroke-width="1"/>
      <text x="995" y="28" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">View Offsets →</text>
    </g>

    <!-- Scan Log Row 3 -->
    <g transform="translate(20, 168)">
      <rect width="1064" height="48" rx="8" fill="#1A1A1D" stroke="#26262B" stroke-width="1"/>
      <rect x="14" y="14" width="70" height="20" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1"/>
      <text x="49" y="28" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STORAGE</text>
      <text x="96" y="29" fill="#D4D4D8" font-family="monospace" font-size="12" font-weight="600">Imported Unity IL2CPP Metadata Dump</text>
      <text x="440" y="29" fill="#71717A" font-family="monospace" font-size="11">1,482 Classes • 18,920 Methods Loaded</text>
      <text x="820" y="29" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">1 hr ago</text>
      <rect x="940" y="10" width="110" height="28" rx="6" fill="#222226" stroke="#35353C" stroke-width="1"/>
      <text x="995" y="28" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Inspect Tree →</text>
    </g>
  </g>
</svg>
