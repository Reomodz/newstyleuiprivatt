<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#18181C"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad4)"/>
  <rect x="24" y="24" width="1152" height="632" rx="12" fill="#141416" stroke="#2B2B30" stroke-width="1.5" filter="url(#shadow4)"/>

  <!-- Window Titlebar -->
  <rect x="24" y="24" width="1152" height="48" rx="12" fill="#1A1A1E" stroke="#2B2B30" stroke-width="1"/>
  <circle cx="52" cy="48" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="72" cy="48" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="92" cy="48" r="6" fill="#10B981" opacity="0.9"/>

  <text x="576" y="53" fill="#E2E2E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    IL2CppManager — Code Style &amp; Custom Template Exporter
  </text>

  <!-- Left: Export Style Selector & Options -->
  <g transform="translate(48, 88)">
    <rect width="360" height="544" rx="8" fill="#18181C" stroke="#2B2B30" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-weight="bold">Target Output Formats</text>
      <text x="0" y="34" fill="#9CA3AF" font-family="sans-serif" font-size="11">Select language template for resolved offsets</text>
    </g>

    <!-- Format Tabs -->
    <g transform="translate(16, 64)">
      <!-- C++ Tab (Active) -->
      <rect width="328" height="42" rx="6" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5"/>
      <text x="16" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">C++ Header / Direct Offsets (0x...)</text>

      <!-- C# Tab -->
      <g transform="translate(0, 52)">
        <rect width="328" height="42" rx="6" fill="#1E1E22" stroke="#2D2D32" stroke-width="1"/>
        <text x="16" y="26" fill="#D4D4D8" font-family="sans-serif" font-size="12">C# Struct / Field Offset Class</text>
      </g>

      <!-- Il2CppType Tab -->
      <g transform="translate(0, 104)">
        <rect width="328" height="42" rx="6" fill="#1E1E22" stroke="#2D2D32" stroke-width="1"/>
        <text x="16" y="26" fill="#D4D4D8" font-family="sans-serif" font-size="12">Il2CppType Function Pointer Defines</text>
      </g>

      <!-- Frida Javascript Tab -->
      <g transform="translate(0, 156)">
        <rect width="328" height="42" rx="6" fill="#1E1E22" stroke="#2D2D32" stroke-width="1"/>
        <text x="16" y="26" fill="#D4D4D8" font-family="sans-serif" font-size="12">Frida Hooking Script (.js)</text>
      </g>

      <!-- Cheat Engine XML Tab -->
      <g transform="translate(0, 208)">
        <rect width="328" height="42" rx="6" fill="#1E1E22" stroke="#2D2D32" stroke-width="1"/>
        <text x="16" y="26" fill="#D4D4D8" font-family="sans-serif" font-size="12">Cheat Engine Address Table (.ct)</text>
      </g>

      <!-- Custom Dynamic Template Tab -->
      <g transform="translate(0, 260)">
        <rect width="328" height="42" rx="6" fill="#1E1E22" stroke="#2D2D32" stroke-width="1"/>
        <text x="16" y="26" fill="#D4D4D8" font-family="sans-serif" font-size="12">Custom {{alias}} / {{offset}} Template</text>
      </g>
    </g>

    <!-- Copy & Download Actions -->
    <g transform="translate(16, 470)">
      <rect width="328" height="42" rx="8" fill="#4F46E5" stroke="#6366F1" stroke-width="1"/>
      <text x="164" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📋 Copy Output to Clipboard</text>
    </g>
  </g>

  <!-- Right: Code Preview Window -->
  <g transform="translate(424, 88)">
    <rect width="728" height="544" rx="8" fill="#18181C" stroke="#2B2B30" stroke-width="1"/>

    <!-- Code Header -->
    <g transform="translate(20, 16)">
      <text x="0" y="16" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-weight="bold">Live Code Generator Preview</text>
      <text x="0" y="34" fill="#9CA3AF" font-family="monospace" font-size="11">// Generated by IL2CppManager for Unity Runtime</text>
    </g>

    <!-- Code Container -->
    <g transform="translate(20, 60)">
      <rect width="688" height="456" rx="6" fill="#101013" stroke="#26262B" stroke-width="1"/>

      <g transform="translate(20, 28)">
        <text x="0" y="0" fill="#71717A" font-family="monospace" font-size="12">#pragma once</text>
        <text x="0" y="20" fill="#71717A" font-family="monospace" font-size="12">#include &lt;cstdint&gt;</text>

        <text x="0" y="55" fill="#60A5FA" font-family="monospace" font-size="12">namespace <text fill="#F4F4F5">IL2CPP::Offsets {</text></text>

        <text x="24" y="90" fill="#71717A" font-family="monospace" font-size="12">// Target Profile: Player Movement &amp; Stats</text>
        
        <text x="24" y="120" fill="#A78BFA" font-family="monospace" font-size="12">namespace <text fill="#FCD34D">PlayerController <text fill="#F4F4F5">{</text></text></text>
        <text x="48" y="145" fill="#34D399" font-family="monospace" font-size="12">constexpr uintptr_t <text fill="#E4E4E7">m_LocalPlayer   <text fill="#60A5FA">= <text fill="#F59E0B">0x18F420<text fill="#F4F4F5">; // Method RVA</text></text></text></text></text>
        <text x="48" y="170" fill="#34D399" font-family="monospace" font-size="12">constexpr uint32_t  <text fill="#E4E4E7">movementSpeed   <text fill="#60A5FA">= <text fill="#F59E0B">0x000020<text fill="#F4F4F5">; // Field Offset</text></text></text></text></text>
        <text x="48" y="195" fill="#34D399" font-family="monospace" font-size="12">constexpr uint32_t  <text fill="#E4E4E7">currentVelocity <text fill="#60A5FA">= <text fill="#F59E0B">0x000028<text fill="#F4F4F5">; // Field Offset</text></text></text></text></text>
        <text x="24" y="220" fill="#F4F4F5" font-family="monospace" font-size="12">}</text>

        <text x="24" y="255" fill="#71717A" font-family="monospace" font-size="12">// Target Profile: Weapon &amp; Ballistics System</text>
        <text x="24" y="285" fill="#A78BFA" font-family="monospace" font-size="12">namespace <text fill="#FCD34D">WeaponController <text fill="#F4F4F5">{</text></text></text>
        <text x="48" y="310" fill="#34D399" font-family="monospace" font-size="12">constexpr uint32_t  <text fill="#E4E4E7">recoilSpread    <text fill="#60A5FA">= <text fill="#F59E0B">0x000030<text fill="#F4F4F5">; // Field Offset</text></text></text></text></text>
        <text x="48" y="335" fill="#34D399" font-family="monospace" font-size="12">constexpr uint32_t  <text fill="#E4E4E7">currentAmmo     <text fill="#60A5FA">= <text fill="#F59E0B">0x000044<text fill="#F4F4F5">; // Field Offset</text></text></text></text></text>
        <text x="24" y="360" fill="#F4F4F5" font-family="monospace" font-size="12">}</text>

        <text x="0" y="395" fill="#F4F4F5" font-family="monospace" font-size="12">}</text>
      </g>
    </g>
  </g>
</svg>
