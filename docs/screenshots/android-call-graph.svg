    <text x="25" y="65" fill="#7DD3FC" font-family="monospace" font-size="14">GamePlay.Player.PlayerController</text>
    <rect x="25" y="80" width="90" height="26" rx="6" fill="#082F49"/>
    <text x="70" y="98" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">0x182E720</text>
