  <path d="M 370 650 C 440 650, 440 500, 500 500" fill="none" stroke="#0284C7" stroke-width="4"/>
  <polygon points="500,500 488,493 488,507" fill="#0284C7"/>
  <rect x="400" y="555" width="90" height="26" rx="6" fill="#0C4A6E"/>
  <text x="445" y="573" fill="#7DD3FC" font-family="monospace" font-size="12" text-anchor="middle">0x0182E418</text>

  <path d="M 370 650 C 440 650, 440 780, 500 780" fill="none" stroke="#0284C7" stroke-width="4"/>
  <polygon points="500,780 488,773 488,787" fill="#0284C7"/>
  <rect x="400" y="725" width="90" height="26" rx="6" fill="#0C4A6E"/>
  <text x="445" y="743" fill="#7DD3FC" font-family="monospace" font-size="12" text-anchor="middle">0x0182E424</text>

