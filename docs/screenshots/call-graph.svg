<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#18181C"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad3)"/>
  <rect x="24" y="24" width="1152" height="632" rx="12" fill="#141416" stroke="#2B2B30" stroke-width="1.5" filter="url(#shadow3)"/>

  <!-- Window Titlebar -->
  <rect x="24" y="24" width="1152" height="48" rx="12" fill="#1A1A1E" stroke="#2B2B30" stroke-width="1"/>
  <circle cx="52" cy="48" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="72" cy="48" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="92" cy="48" r="6" fill="#10B981" opacity="0.9"/>

  <text x="576" y="53" fill="#E2E2E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    IL2CppManager — Interactive Call Graph &amp; ARM64 Disassembler
  </text>

  <!-- Left: Node Canvas -->
  <g transform="translate(48, 88)">
    <rect width="640" height="544" rx="8" fill="#101013" stroke="#2B2B30" stroke-width="1"/>
    
    <!-- Canvas Grid Dots -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#24242A"/>
    </pattern>
    <rect width="640" height="544" rx="8" fill="url(#dotGrid)"/>

    <!-- Graph Tools Bar -->
    <g transform="translate(16, 16)">
      <rect width="180" height="32" rx="6" fill="#1C1C20" stroke="#323238" stroke-width="1"/>
      <text x="24" y="21" fill="#D4D4D8" font-family="sans-serif" font-size="11">🔍 Zoom</text>
      <text x="80" y="21" fill="#D4D4D8" font-family="sans-serif" font-size="11">🎯 Center</text>
      <text x="138" y="21" fill="#D4D4D8" font-family="sans-serif" font-size="11">⚡ Relayout</text>
    </g>

    <!-- Bezier Connecting Curves -->
    <path d="M 190 260 C 270 260, 270 170, 360 170" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="4,2"/>
    <path d="M 190 260 C 270 260, 270 340, 360 340" fill="none" stroke="#6366F1" stroke-width="2.5"/>
    <path d="M 190 260 C 270 260, 270 450, 360 450" fill="none" stroke="#6366F1" stroke-width="2.5"/>

    <!-- Center Calling Node -->
    <g transform="translate(40, 220)">
      <rect width="160" height="80" rx="8" fill="#1F1F24" stroke="#6366F1" stroke-width="2"/>
      <rect x="8" y="8" width="56" height="18" rx="4" fill="#6366F1" fill-opacity="0.2"/>
      <text x="36" y="21" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CALLER</text>
      <text x="12" y="44" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">PlayerController</text>
      <text x="12" y="62" fill="#9CA3AF" font-family="monospace" font-size="11">.Update()</text>
    </g>

    <!-- Callee Node 1 -->
    <g transform="translate(360, 130)">
      <rect width="220" height="74" rx="8" fill="#18181C" stroke="#2F2F36" stroke-width="1.5"/>
      <rect x="8" y="8" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
      <text x="38" y="21" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CALLEE</text>
      <text x="12" y="42" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="bold">Physics.Raycast()</text>
      <text x="12" y="58" fill="#F59E0B" font-family="monospace" font-size="10">RVA: 0x24C810</text>
    </g>

    <!-- Callee Node 2 -->
    <g transform="translate(360, 300)">
      <rect width="220" height="74" rx="8" fill="#18181C" stroke="#4F46E5" stroke-width="1.5"/>
      <rect x="8" y="8" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
      <text x="38" y="21" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SELECTED</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">PlayerMotor.Move()</text>
      <text x="12" y="58" fill="#F59E0B" font-family="monospace" font-size="10">RVA: 0x18FA80</text>
    </g>

    <!-- Callee Node 3 -->
    <g transform="translate(360, 410)">
      <rect width="220" height="74" rx="8" fill="#18181C" stroke="#2F2F36" stroke-width="1.5"/>
      <rect x="8" y="8" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
      <text x="38" y="21" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CALLEE</text>
      <text x="12" y="42" fill="#E4E4E7" font-family="monospace" font-size="11" font-weight="bold">Transform.set_position()</text>
      <text x="12" y="58" fill="#F59E0B" font-family="monospace" font-size="10">RVA: 0x310D40</text>
    </g>
  </g>

  <!-- Right: ARM64 Disassembler Table -->
  <g transform="translate(704, 88)">
    <rect width="448" height="544" rx="8" fill="#18181C" stroke="#2B2B30" stroke-width="1"/>

    <!-- Disassembly Header -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-weight="bold">ARM64 Native Disassembly</text>
      <text x="0" y="34" fill="#A1A1AA" font-family="monospace" font-size="11">Method: PlayerMotor.Move (0x18FA80)</text>
    </g>

    <!-- Disassembly Code Block -->
    <g transform="translate(16, 60)">
      <rect width="416" height="456" rx="6" fill="#121214" stroke="#26262B" stroke-width="1"/>

      <!-- Instruction Rows -->
      <g transform="translate(12, 24)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA80:</text>
        <text x="90" y="12" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">STP</text>
        <text x="135" y="12" fill="#F4F4F5" font-family="monospace" font-size="11">X29, X30, [SP, #-0x20]!</text>
      </g>

      <g transform="translate(12, 54)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA84:</text>
        <text x="90" y="12" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">MOV</text>
        <text x="135" y="12" fill="#F4F4F5" font-family="monospace" font-size="11">X29, SP</text>
      </g>

      <g transform="translate(12, 84)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA88:</text>
        <text x="90" y="12" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">LDR</text>
        <text x="135" y="12" fill="#FCD34D" font-family="monospace" font-size="11">X8, [X0, #0x20]</text>
        <text x="310" y="12" fill="#71717A" font-family="monospace" font-size="10">; speed</text>
      </g>

      <g transform="translate(12, 114)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA8C:</text>
        <text x="90" y="12" fill="#F472B6" font-family="monospace" font-size="11" font-weight="bold">FMUL</text>
        <text x="135" y="12" fill="#F4F4F5" font-family="monospace" font-size="11">S0, S0, S1</text>
      </g>

      <g transform="translate(12, 144)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA90:</text>
        <text x="90" y="12" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">STR</text>
        <text x="135" y="12" fill="#FCD34D" font-family="monospace" font-size="11">S0, [X0, #0x28]</text>
        <text x="310" y="12" fill="#71717A" font-family="monospace" font-size="10">; velocity</text>
      </g>

      <g transform="translate(12, 174)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA94:</text>
        <text x="90" y="12" fill="#818CF8" font-family="monospace" font-size="11" font-weight="bold">BL</text>
        <text x="135" y="12" fill="#6EE7B7" font-family="monospace" font-size="11">#0x310D40</text>
        <text x="240" y="12" fill="#A5B4FC" font-family="monospace" font-size="10">; set_pos</text>
      </g>

      <g transform="translate(12, 204)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA98:</text>
        <text x="90" y="12" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">LDP</text>
        <text x="135" y="12" fill="#F4F4F5" font-family="monospace" font-size="11">X29, X30, [SP], #0x20</text>
      </g>

      <g transform="translate(12, 234)">
        <text x="0" y="12" fill="#71717A" font-family="monospace" font-size="11">0x18FA9C:</text>
        <text x="90" y="12" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">RET</text>
      </g>
    </g>
  </g>
</svg>
