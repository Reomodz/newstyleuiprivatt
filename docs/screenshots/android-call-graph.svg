    <rect x="855" y="34" width="22" height="14" rx="3" fill="none" stroke="#A0A0B0" stroke-width="2"/>
    <rect x="857" y="36" width="10" height="10" rx="1.5" fill="#A0A0B0"/>
  </g>

  <!-- Top Bar -->
  <rect x="0" y="80" width="900" height="90" fill="#141419" stroke="#22222B" stroke-width="1"/>
